<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Stylized "V" Icon with AI Node Network -->
  <g filter="url(#glow)">
    <!-- Circuit Lines -->
    <path d="M28 36 L64 96 L100 36" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M46 54 L64 82 L82 54" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    
    <!-- Central AI Core Node -->
    <circle cx="64" cy="96" r="6" fill="#38bdf8" />
    <circle cx="28" cy="36" r="5" fill="#a855f7" />
    <circle cx="100" cy="36" r="5" fill="#38bdf8" />
    <circle cx="64" cy="50" r="4" fill="#ffffff" />
  </g>
</svg>
